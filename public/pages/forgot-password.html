<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié — Magny FC 78</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" href="/assets/images/logo.png" type="image/png">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <div class="brand"><span class="logo">MFC</span><h1>Mot de passe oublié</h1></div>
      <p class="subtitle center">Saisissez votre email, nous vous enverrons un lien de réinitialisation.</p>
      <div id="alert" class="alert"></div>
      <form id="forgot-form">
        <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="email" required></div>
        <button class="btn" id="btn-forgot" type="submit">Envoyer le lien</button>
      </form>
      <div class="foot"><a href="/pages/login.html">Retour à la connexion</a></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>AuthUI.initForgot();</script>
</body>
</html>
