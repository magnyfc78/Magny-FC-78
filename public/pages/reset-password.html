<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — Magny FC 78</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="icon" href="/assets/images/logo.png" type="image/png">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <div class="brand"><span class="logo">MFC</span><h1>Nouveau mot de passe</h1></div>
      <div id="alert" class="alert"></div>
      <form id="reset-form">
        <div class="field"><label for="password">Nouveau mot de passe</label><input type="password" id="password" autocomplete="new-password" required>
          <div class="hint">8 caractères min., 1 majuscule, 1 minuscule, 1 chiffre, 1 caractère spécial.</div></div>
        <div class="field"><label for="password2">Confirmer</label><input type="password" id="password2" autocomplete="new-password" required></div>
        <button class="btn" id="btn-reset" type="submit">Réinitialiser</button>
      </form>
      <div id="to-login" class="foot hidden"><a class="btn" href="/pages/login.html">Se connecter</a></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>AuthUI.initReset();</script>
</body>
</html>
